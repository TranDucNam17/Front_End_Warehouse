<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Giao Diện</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" type="text/css" rel="stylesheet">

    <!-- Import jQuery (vì thư viện MKAC phụ thuộc jQuery) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>

    <!-- Import thư viện Table2 -->
    <link href="http://192.84.100.96:3901/lib/htmlTable2/table.css" type="text/css" rel="stylesheet" />
    <script src="http://192.84.100.96:3901/lib/htmlTable2/table.js"></script>

    <!-- Import thư viện SearchBar -->
    <script src="http://192.84.100.96:3901/lib/htmlSearchBar2/search_bar.js"></script>
    <link href="http://192.84.100.96:3901/lib/htmlSearchBar2/search_bar.css" type="text/css" rel="stylesheet" />

    <style>
        body { font-family: Arial, sans-serif; font-size: 14px; background-color: #fff; color: #000; padding: 20px;}
        .form-label { font-size: 14px; margin-bottom: 0.3rem; font-weight: bold; }
        .form-control, .form-select { border-radius: 0; border-color: #888; height: 38px; }
        .search-btn { background-color: #729fe8; border: 1px solid #5080c8; border-radius: 0; color: #111; font-weight: 500; padding: 0.375rem 2rem; height: 38px;}
        .create-plan-btn { background-color: #4ac9ad; border: 1px solid #3eb49a; border-radius: 0; padding: 8px 24px; font-weight: bold; }
        .table { border: 1px solid #333; margin-bottom: 0; }
        .table thead th { background-color: #d1d1d1; border: 1px solid #333; color: #000; font-weight: 600; padding: 12px; text-align: center; }
        .table tbody td { border: 1px solid #333; padding: 12px; text-align: center; vertical-align: middle;}
    </style>
</head>
<body>
    <h4 class="mb-4 text-danger">Bản xem trước giao diện (Mockup HTML)</h4>
    <div id = 'search' class="row align-items-end mb-3">
        
    </div>
    <div class="mb-3 mt-4">
        <input type="checkbox" style="width: 22px; height: 22px; border: 1px solid #777; vertical-align: middle;">
    </div>
    <div id= 'table' class="table-responsive">
        
    </div>
    <div class="mt-4 text-end">
        <button class="btn create-plan-btn">Tạo kế hoạch kiểm kê</button>
    </div>
    <script src="script.js"></script>
